<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printable QR cards &mdash; Frog Call Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  body { background: #f4f6f2; }
  .page-head { padding: 30px 24px 0; }
  .page-head h1 { font-family: var(--font-display); color: #111; }
  .page-head p { color: #555; font-family: var(--font-body); }
  .wrap-cards { max-width: 900px; margin: 0 auto; padding: 0 24px 60px; }
</style>
</head>
<body>
  <div class="page-head no-print">
    <h1>Printable QR cards</h1>
    <p>One card per species &middot; cut along the dashed borders &middot; use your browser's Print (Ctrl/Cmd+P) to print this page.</p>
  </div>
  <div class="wrap-cards">
    <div class="card-grid" id="card-grid">
      <p class="empty-state">Loading catalog&hellip;</p>
    </div>
  </div>
  <script src="assets/js/util.js"></script>
  <script>
    function escapeHtml(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';}
    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('card-grid');
      try {
        const data = await loadCatalog('');
        const baseUrl = (data.config && data.config.base_url || '').replace(/\/$/, '');
        const species = data.species || [];
        grid.innerHTML = species.map((sp) => `
          <div class="qr-card">
            <span class="qr-slot" data-slug="${escapeHtml(sp.slug)}"></span>
            <div>
              <div class="card-acc">${escapeHtml(sp.accession)}</div>
              <p class="card-sci"><i>${escapeHtml(sp.genus)} ${escapeHtml(sp.species)}</i></p>
              ${sp.common_name ? `<div class="card-common">${escapeHtml(sp.common_name)}</div>` : ''}
            </div>
          </div>`).join('');

        grid.querySelectorAll('.qr-slot').forEach((slot) => {
          const slug = slot.getAttribute('data-slug');
          const img = document.createElement('img');
          img.width = 96; img.height = 96;
          img.alt = 'QR code for ' + slug;
          img.src = `assets/qr/${slug}.png`;
          img.onerror = () => {
            // No pre-generated PNG committed yet (e.g. added via admin) --
            // render one on the fly instead, pointed at species.html?slug=.
            const canvas = document.createElement('canvas');
            slot.replaceChild(canvas, img);
            const url = `${baseUrl}/species.html?slug=${encodeURIComponent(slug)}`;
            if (window.QRCode) QRCode.toCanvas(canvas, url, { width: 96, margin: 1 });
          };
          slot.appendChild(img);
        });
      } catch (err) {
        grid.innerHTML = `<p class="empty-state">Could not load catalog: ${escapeHtml(err.message)}</p>`;
      }
    });
  </script>
</body>
</html>
